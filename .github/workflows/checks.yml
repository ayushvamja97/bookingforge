name: BookingForge Checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python ML and API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-api.txt
      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements-api.txt
      - name: Execute synthetic unit and integration tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m unittest discover -s tests -v

  frontend:
    name: Next.js checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Validate research request contract
        run: npm run test
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
